workflows:
  smot-academy-ios:
    name: S.MOT Academy iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: Beauty Money Apple
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - iOS_signing
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Build web app for iOS
        script: node build-web.mjs
      - name: Sync Capacitor project
        script: npx cap sync ios
      - name: Set build number
        script: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
      - name: Set app version
        # Version shown in the App Store. Raise it for every new release (1.0.0 → 1.0.1 …),
        # or set APP_VERSION when starting the build in Codemagic.
        script: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION:-1.0.0}" ios/App/App/Info.plist
      - name: Initialize keychain
        script: keychain initialize
      - name: Prepare signing key
        # Accepts the key either as CERTIFICATE_PRIVATE_KEY_BASE64 (one line, safest to paste)
        # or as CERTIFICATE_PRIVATE_KEY (the PEM text). Repairs keys whose line breaks were lost.
        script: |
          set -e
          KEY_FILE="$CM_BUILD_DIR/cert_key.pem"
          echo "Length of base64 key variable: ${#CERTIFICATE_PRIVATE_KEY_BASE64} (expected about 1600)"
          echo "Length of text key variable: ${#CERTIFICATE_PRIVATE_KEY} (expected about 1700)"
          if [ -n "$CERTIFICATE_PRIVATE_KEY_BASE64" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY_BASE64"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY_FILE"
          else
            echo "Using CERTIFICATE_PRIVATE_KEY"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
            if [ "$(wc -l < "$KEY_FILE")" -lt 3 ]; then
              echo "Key has no line breaks - rebuilding PEM format"
              BODY=$(tr -d '\n' < "$KEY_FILE" | sed -E 's/-----BEGIN [A-Z ]+-----//; s/-----END [A-Z ]+-----//' | tr -d ' ')
              { echo "-----BEGIN RSA PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END RSA PRIVATE KEY-----"; } > "$KEY_FILE"
            fi
          fi
          echo "First line: $(head -1 "$KEY_FILE")"
          echo "Lines: $(wc -l < "$KEY_FILE")"
          openssl rsa -in "$KEY_FILE" -check -noout
      - name: Fetch signing files
        script: app-store-connect fetch-signing-files "com.svitlanamot.smotacademy" --type IOS_APP_STORE --create --certificate-key=@file:$CM_BUILD_DIR/cert_key.pem
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Configure code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build App Store archive
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
